name: Build Android application on new tag
run-name: Building CalcMoney (${{ github.ref_name }})
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # force download all commits

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Set Version Variables
        run: |
          # VERSION_NAME
          TAG_NAME="${{ github.ref_name }}"
          echo "VERSION_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$TAG_NAME"
          
          # VERSION_CODE
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_ENV
          echo "VERSION_CODE=$COMMIT_COUNT"

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease -PVERSION_NAME="${{ env.VERSION_NAME }}" -PVERSION_CODE="${{ env.VERSION_CODE }}"

      - name: Rename APK file
        run: |
          mkdir -p dist/
          cp app/build/outputs/apk/release/app-release*.apk "dist/calcmoney-${{ github.ref_name }}.apk"

      - name: Generate Changelog
        run: |
          # Retrieve previous tag (if there is one)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD")
          fi
          
          # Creating multi-line variable
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: dist/calcmoney-*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### What's new ?
            
            ${{ env.CHANGELOG }}
          draft: false
          prerelease: false